name: Windows private Mobile MCP executable

on:
  push:
    branches: [main, feature/windows-exe-private-agent-installer]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      MOBILEMCP_DISABLE_TELEMETRY: "1"
      MOBILEWRIGHT_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript compile
        run: npm run build

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Compile standalone Windows CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          bun build ./src/index.ts --compile --target=bun-windows-x64 --outfile dist/mobile-mcp.exe
          if ($LASTEXITCODE -ne 0) { throw "Bun compiler failed" }

      - name: Package native device-control companion
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Path node_modules -Recurse -File -Filter "mobilecli-windows-amd64.exe" |
            Select-Object -First 1
          if (-not $binary) { throw "Pinned mobilecli-windows-amd64.exe was not installed" }
          Copy-Item -LiteralPath $binary.FullName -Destination dist/mobilecli-windows-amd64.exe

      - name: Smoke test executable and reversible installers
        shell: pwsh
        run: node scripts/smoke-windows.mjs

      - name: Privacy static assertions
        shell: pwsh
        run: |
          $source = Get-Content src/server.ts -Raw
          if ($source -match 'us\.i\.posthog\.com|static\.scarf\.sh|get_more_tools|posthog\(') {
            throw "Unexpected MCP server tracking code"
          }

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - name: Upload Windows binary bundle
        uses: actions/upload-artifact@v4
        with:
          name: mobile-mcp-windows-x64
          path: |
            dist/mobile-mcp.exe
            dist/mobilecli-windows-amd64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
